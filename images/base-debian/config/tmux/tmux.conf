# aibox tmux configuration
#
# This file is generated into .aibox-home/.config/tmux/tmux.conf. The plugin
# tree is preinstalled and pinned in the base image under
# /usr/local/share/aibox/tmux/plugins so the default runtime does not need
# network access or an interactive TPM install step.

set -g default-shell /bin/bash
set -g default-command /bin/bash
set -g prefix C-b
unbind C-b
bind C-b send-prefix

set -g mouse on
set -g mode-keys vi
set -g history-limit 10000
set -g escape-time 10
set -g focus-events on
set -g allow-passthrough on
# Preserve host terminal-emulator detection vars across detach/reattach so TUIs
# (yazi, vim, …) keep skipping their startup CSI probes. Mirrors the passthrough
# list set in .devcontainer/docker-compose.yml — keep them in sync.
set -ga update-environment "TERM_PROGRAM TERM_PROGRAM_VERSION KITTY_WINDOW_ID KITTY_PUBLIC_KEY WEZTERM_PANE WEZTERM_EXECUTABLE WEZTERM_CONFIG_FILE ITERM_SESSION_ID ITERM_PROFILE GHOSTTY_RESOURCES_DIR ALACRITTY_LOG ALACRITTY_SOCKET KONSOLE_VERSION KONSOLE_DBUS_SERVICE VTE_VERSION WT_SESSION WT_PROFILE_ID FOOT_VERSION HYPER_VERSION XTERM_VERSION VSCODE_INJECTION"
set -g default-terminal "tmux-256color"
set -ga terminal-features ",xterm-256color:RGB,tmux-256color:RGB"
set -ga terminal-overrides ",xterm-256color:Tc,tmux-256color:Tc"
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off
set -g set-clipboard on
set -g status on
set -g status-interval 5
set -g status-left " #S #{W:#I:#W ,#[reverse]#I:#W#[noreverse] }"
set -g status-left-length 80

bind-key -N "Show aibox/tmux key bindings" ? display-popup -w 80% -h 75% -E "tmux list-keys -N | less -R"
bind-key -N "Reload tmux config" r source-file ~/.config/tmux/tmux.conf \; display-message "aibox tmux config reloaded"
bind-key -N "Split pane right" | split-window -h -c "#{pane_current_path}"
bind-key -N "Split pane down" - split-window -v -c "#{pane_current_path}"
bind-key -N "Select pane left" h select-pane -L
bind-key -N "Select pane down" j select-pane -D
bind-key -N "Select pane up" k select-pane -U
bind-key -N "Select pane right" l select-pane -R
bind-key -N "Resize pane left" H resize-pane -L 5
bind-key -N "Resize pane down" J resize-pane -D 3
bind-key -N "Resize pane up" K resize-pane -U 3
bind-key -N "Resize pane right" L resize-pane -R 5
bind-key -N "Toggle pane zoom" f resize-pane -Z
bind-key -N "Kill pane" x kill-pane
bind-key -N "Kill window" X kill-window
bind-key -N "New window" c new-window -c "#{pane_current_path}"
bind-key -N "Choose window or pane" s choose-tree -Zw
bind-key -N "Move pane to window" m choose-tree -s
bind-key -N "Toggle aibox status mode" z run-shell aibox-status-toggle
bind-key -N "Enter copy mode" [ copy-mode
bind-key -N "Search scrollback" / copy-mode \; send-keys /

bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel "tmux load-buffer - && tmux save-buffer - | xclip -selection clipboard -in 2>/dev/null || true"

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +${vim_pattern}$'"
bind-key -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind-key -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind-key -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind-key -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"
bind-key -n C-\\ if-shell "$is_vim" "send-keys C-\\" "select-pane -l"
bind-key -T copy-mode-vi C-h select-pane -L
bind-key -T copy-mode-vi C-j select-pane -D
bind-key -T copy-mode-vi C-k select-pane -U
bind-key -T copy-mode-vi C-l select-pane -R
bind-key -T copy-mode-vi C-\\ select-pane -l

# Powerkit status — full owner-spec layout (SleekGrove / DEC-20260509_2125-CoolFrog).
# Slot order is intentionally fixed per DEC-20260508_2115-SilentFern; any
# reordering requires a schema bump and a paired Migration entity.
#
# Line 1 right:  ssh → aibox_log → aibox_oom → aibox_proc → aibox_ai → aibox_mcp → aibox_mig
#                → weather → uptime → datetime
# Line 2 left:   git → github → kubernetes → terraform → cloud
# Line 2 right:  cpu → hostname → externalip → netspeed → ping → loadavg
#                → memory → swap → disk → gpu
#
# Plugins not yet implemented in aibox powerkit-plugins/ are expected to be
# provided by the upstream tmux-powerkit library (fabioluciano/tmux-powerkit).
# If an upstream plugin is absent it is silently skipped by powerkit at runtime.
set -g @powerkit_plugins "ssh,aibox_log,aibox_oom,aibox_proc,aibox_ai,aibox_mcp,aibox_mig,weather,uptime,datetime,git,github,kubernetes,terraform,cloud,cpu,hostname,externalip,netspeed,ping,loadavg,memory,swap,disk,gpu"
set -g @powerkit_bar_layout "double"
set -g @powerkit_status_order "session,plugins"
set -g @powerkit_theme "nord"
set -g @powerkit_theme_variant "dark"
set -g @powerkit_separator_style "rounded"
set -g @powerkit_elements_spacing "both"
set -g @powerkit_status_interval "5"
set -g @powerkit_transparent "false"
set -g @powerkit_pane_border_status "top"
set -g @powerkit_pane_border_format "#{?client_prefix,PREFIX,NORMAL} #{pane_title} #{pane_current_command}"
set -g @powerkit_line1_right "ssh,aibox_log,aibox_oom,aibox_proc,aibox_ai,aibox_mcp,aibox_mig,weather,uptime,datetime"
set -g @powerkit_line2_left "git,github,kubernetes,terraform,cloud"
set -g @powerkit_line2_right "cpu,hostname,externalip,netspeed,ping,loadavg,memory,swap,disk,gpu"
set -g @powerkit_plugin_aibox_log_metric "log"
set -g @powerkit_plugin_aibox_oom_metric "oom"
set -g @powerkit_plugin_aibox_proc_metric "proc"
set -g @powerkit_plugin_aibox_ai_metric "ai"
set -g @powerkit_plugin_aibox_mcp_metric "mcp"
set -g @powerkit_plugin_aibox_mig_metric "mig"

# Persistence plugins are shipped pinned but disabled by default until aibox has
# a policy for restoring AI panes, MCP proxies, and one-shot setup commands.
set -g @resurrect-dir "$HOME/.local/share/tmux/resurrect"
set -g @continuum-restore 'off'
set -g @continuum-save-interval '0'
set -g @resurrect-capture-pane-contents 'off'

run-shell /usr/local/share/aibox/tmux/plugins/tmux-sensible/sensible.tmux
run-shell /usr/local/share/aibox/tmux/plugins/vim-tmux-navigator/vim-tmux-navigator.tmux
run-shell /usr/local/share/aibox/tmux/plugins/tmux-yank/yank.tmux
run-shell /usr/local/share/aibox/tmux/plugins/tmux-powerkit/tmux-powerkit.tmux

# Optional persistence layer:
#   run-shell /usr/local/share/aibox/tmux/plugins/tmux-resurrect/resurrect.tmux
#   run-shell /usr/local/share/aibox/tmux/plugins/tmux-continuum/continuum.tmux

# TPM is present as a user convenience layer for additional project-local
# plugins. aibox-managed plugins above are preinstalled and do not depend on
# prefix + I.
run-shell /usr/local/share/aibox/tmux/plugins/tpm/tpm
