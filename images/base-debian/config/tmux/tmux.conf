# aibox tmux configuration
#
# This file is generated into .aibox-home/.config/tmux/tmux.conf. The plugin
# tree is preinstalled and pinned in the base image under
# /usr/local/share/aibox/tmux/plugins so the default runtime does not need
# network access or an interactive TPM install step.

set -g default-shell /bin/bash
set -g default-command /bin/bash
set -g prefix C-b
unbind C-b
bind C-b send-prefix

set -g mouse on
set -g mode-keys vi
set -g history-limit 10000
set -g escape-time 10
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off
set -g set-clipboard on
set -g status on
set -g status-interval 5

bind r source-file ~/.config/tmux/tmux.conf \; display-message "aibox tmux config reloaded"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind H resize-pane -L 5
bind J resize-pane -D 3
bind K resize-pane -U 3
bind L resize-pane -R 5
bind f resize-pane -Z
bind x kill-pane
bind X kill-window
bind c new-window -c "#{pane_current_path}"
bind s choose-tree -Zw
bind m choose-tree -s
bind z run-shell aibox-status-toggle
bind [ copy-mode
bind / copy-mode \; send-keys /

bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel "tmux load-buffer - && tmux save-buffer - | xclip -selection clipboard -in 2>/dev/null || true"

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +${vim_pattern}$'"
bind-key -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind-key -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind-key -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind-key -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"
bind-key -n C-\\ if-shell "$is_vim" "send-keys C-\\" "select-pane -l"
bind-key -T copy-mode-vi C-h select-pane -L
bind-key -T copy-mode-vi C-j select-pane -D
bind-key -T copy-mode-vi C-k select-pane -U
bind-key -T copy-mode-vi C-l select-pane -R
bind-key -T copy-mode-vi C-\\ select-pane -l

# Powerkit status. Keep the plugin list intentionally bounded for container
# runtime safety; heavier network/cloud/media plugins stay user opt-in.
set -g @powerkit_plugins "git,hostname,datetime,aibox"
set -g @powerkit_theme "nord"
set -g @powerkit_theme_variant "dark"
set -g @powerkit_separator_style "rounded"
set -g @powerkit_elements_spacing "both"
set -g @powerkit_status_interval "5"
set -g @powerkit_transparent "false"

# Persistence plugins are shipped pinned but disabled by default until aibox has
# a policy for restoring AI panes, MCP proxies, and one-shot setup commands.
set -g @resurrect-dir "$HOME/.local/share/tmux/resurrect"
set -g @continuum-restore "off"
set -g @continuum-save-interval "15"

run-shell /usr/local/share/aibox/tmux/plugins/tmux-sensible/sensible.tmux
run-shell /usr/local/share/aibox/tmux/plugins/vim-tmux-navigator/vim-tmux-navigator.tmux
run-shell /usr/local/share/aibox/tmux/plugins/tmux-yank/yank.tmux
run-shell /usr/local/share/aibox/tmux/plugins/tmux-powerkit/tmux-powerkit.tmux

# Optional persistence layer:
#   run-shell /usr/local/share/aibox/tmux/plugins/tmux-resurrect/resurrect.tmux
#   run-shell /usr/local/share/aibox/tmux/plugins/tmux-continuum/continuum.tmux

# TPM is present as a user convenience layer for additional project-local
# plugins. aibox-managed plugins above are preinstalled and do not depend on
# prefix + I.
run-shell /usr/local/share/aibox/tmux/plugins/tpm/tpm
