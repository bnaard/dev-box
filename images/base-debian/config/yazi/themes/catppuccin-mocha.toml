# =============================================================================
# Yazi theme — catppuccin mocha
# Docs: https://yazi-rs.github.io/docs/configuration/theme
# =============================================================================

[mgr]
cwd = { fg = "#89B4FA" }
hovered = { fg = "#1E1E2E", bg = "#CDD6F4" }
preview_hovered = { underline = true }
find_keyword = { fg = "#F9E2AF", bold = true }
find_position = { fg = "#F5C2E7", italic = true }
marker_selected = { fg = "#A6E3A1", bg = "#A6E3A1" }
marker_copied = { fg = "#89B4FA", bg = "#89B4FA" }
marker_cut = { fg = "#F38BA8", bg = "#F38BA8" }

[tabs]
active = { fg = "#1E1E2E", bg = "#CDD6F4", bold = true }
inactive = { fg = "#6C7086", bg = "#313244" }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[mode]
normal_main = { fg = "#1E1E2E", bg = "#A6E3A1", bold = true }
normal_alt = { fg = "#A6E3A1", bg = "#313244", bold = true }
select_main = { fg = "#1E1E2E", bg = "#89B4FA", bold = true }
select_alt = { fg = "#89B4FA", bg = "#313244", bold = true }
unset_main = { fg = "#1E1E2E", bg = "#F5C2E7", bold = true }
unset_alt = { fg = "#F5C2E7", bg = "#313244", bold = true }

[status]
overall = { fg = "#CDD6F4", bg = "#313244" }
sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }
perm_type = { fg = "#89B4FA" }
perm_read = { fg = "#F9E2AF" }
perm_write = { fg = "#F38BA8" }
perm_exec = { fg = "#A6E3A1" }
perm_sep = { fg = "#6C7086" }
progress_label = { fg = "#CDD6F4", bold = true }
progress_normal = { fg = "#89B4FA", bg = "#313244" }
progress_error = { fg = "#F38BA8", bg = "#313244" }

[input]
border = { fg = "#89B4FA" }
title = {}
value = {}
selected = { reversed = true }

[pick]
border = { fg = "#89B4FA" }
active = { fg = "#F5C2E7" }
inactive = {}

[cmp]
border = { fg = "#89B4FA" }
active = { fg = "#F5C2E7" }
inactive = {}

[tasks]
border = { fg = "#89B4FA" }
title = {}
hovered = { underline = true }

[which]
mask = { bg = "#313244" }
cand = { fg = "#94E2D5" }
rest = { fg = "#6C7086" }
desc = { fg = "#F5C2E7" }
separator = "  "
separator_style = { fg = "#45475A" }

[help]
on = { fg = "#94E2D5" }
run = { fg = "#F5C2E7" }
desc = {}
hovered = { bg = "#313244", bold = true }
footer = { fg = "#313244", bg = "#CDD6F4" }

[git]
modified = { fg = "#F9E2AF" }
untracked = { fg = "#F5C2E7" }
added = { fg = "#A6E3A1" }
deleted = { fg = "#F38BA8" }
updated = { fg = "#89B4FA" }
ignored = { fg = "#6C7086" }

[filetype]
rules = [
    { url = "*/", fg = "#89B4FA", bold = true },
    { url = "*.rs", fg = "#FAB387" },
    { url = "*.py", fg = "#F9E2AF" },
    { url = "*.js", fg = "#F9E2AF" },
    { url = "*.ts", fg = "#89B4FA" },
    { url = "*.sh", fg = "#A6E3A1" },
    { url = "*.toml", fg = "#94E2D5" },
    { url = "*.yaml", fg = "#94E2D5" },
    { url = "*.yml", fg = "#94E2D5" },
    { url = "*.json", fg = "#94E2D5" },
    { url = "*.kdl", fg = "#94E2D5" },
    { url = "*.html", fg = "#FAB387" },
    { url = "*.css", fg = "#89B4FA" },
    { url = "*.md", fg = "#CDD6F4" },
    { url = "*.tex", fg = "#A6E3A1" },
    { url = "*.typ", fg = "#A6E3A1" },
    { url = "*.pdf", fg = "#F38BA8" },
    { url = "*.png", fg = "#F5C2E7" },
    { url = "*.jpg", fg = "#F5C2E7" },
    { url = "*.jpeg", fg = "#F5C2E7" },
    { url = "*.gif", fg = "#F5C2E7" },
    { url = "*.svg", fg = "#F5C2E7" },
    { url = "*.zip", fg = "#FAB387" },
    { url = "*.tar*", fg = "#FAB387" },
    { url = "*.gz", fg = "#FAB387" },
    { url = "*.gitignore", fg = "#6C7086" },
    { url = ".env*", fg = "#F38BA8" },
    { url = "Dockerfile*", fg = "#89B4FA" },
    { url = "Makefile", fg = "#A6E3A1" },
    { url = "Cargo.toml", fg = "#FAB387", bold = true },
    { url = "Cargo.lock", fg = "#6C7086" },
]
