# aibox starship config — pastel powerline preset
# One-line prompt inspired by https://starship.rs/presets/#pastel-powerline.
palette = "aibox"

format = """
[](fg:#39BAE6)\
$directory\
[](fg:#39BAE6 bg:#AAD94C)\
$git_branch\
$git_status\
[](fg:#AAD94C bg:#FF8F40)\
$python\
$rust\
$nodejs\
$golang\
[](fg:#FF8F40 bg:#0A0E14)\
$cmd_duration\
$character"""

[directory]
style = "bold bg:#39BAE6 fg:#0A0E14"
format = "[ $path ]($style)"
truncation_length = 3
truncate_to_repo = true

[git_branch]
style = "bg:#AAD94C fg:#0A0E14"
symbol = " "
format = "[ $symbol$branch ]($style)"

[git_status]
style = "bg:#AAD94C fg:#0A0E14"
format = "[$all_status$ahead_behind ]($style)"
ahead = "⇡$count"
behind = "⇣$count"
diverged = "⇕⇡$ahead_count⇣$behind_count"
modified = "!$count"
staged = "+$count"
untracked = "?$count"

[python]
style = "bg:#FF8F40 fg:#0A0E14"
format = "[ $symbol$version ]($style)"
[rust]
style = "bg:#FF8F40 fg:#0A0E14"
format = "[ $symbol$version ]($style)"
[nodejs]
style = "bg:#FF8F40 fg:#0A0E14"
format = "[ $symbol$version ]($style)"
[golang]
style = "bg:#FF8F40 fg:#0A0E14"
format = "[ $symbol$version ]($style)"

[cmd_duration]
style = "fg:#626A73"
min_time = 2_000
format = "[ $duration ]($style)"

[character]
success_symbol = "[❯](bold fg:#39BAE6) "
error_symbol = "[❯](bold fg:#F07178) "

[palettes.aibox]
bg = "#0A0E14"
fg = "#B3B1AD"
accent = "#39BAE6"
