# =============================================================================
# Yazi theme — generated by aibox CLI from the active theme palette
# Docs: https://yazi-rs.github.io/docs/configuration/theme
# =============================================================================

[mgr]
cwd = { fg = "#39BAE6" }
hovered = { fg = "#0A0E14", bg = "#B3B1AD" }
preview_hovered = { bg = "#313244", underline = true }
find_keyword = { fg = "#FFB454", bold = true }
find_position = { fg = "#A68EA4", italic = true }
marker_selected = { fg = "#AAD94C", bg = "#AAD94C" }
marker_copied = { fg = "#39BAE6", bg = "#39BAE6" }
marker_cut = { fg = "#F07178", bg = "#F07178" }

[tabs]
active = { fg = "#0A0E14", bg = "#39BAE6", bold = true }
inactive = { fg = "#626A73", bg = "#313244" }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[mode]
normal_main = { fg = "#0A0E14", bg = "#AAD94C", bold = true }
normal_alt = { fg = "#AAD94C", bg = "#313244", bold = true }
select_main = { fg = "#0A0E14", bg = "#39BAE6", bold = true }
select_alt = { fg = "#39BAE6", bg = "#313244", bold = true }
unset_main = { fg = "#0A0E14", bg = "#A68EA4", bold = true }
unset_alt = { fg = "#A68EA4", bg = "#313244", bold = true }

[status]
overall = { fg = "#B3B1AD", bg = "#313244" }
sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }
perm_type = { fg = "#39BAE6" }
perm_read = { fg = "#FFB454" }
perm_write = { fg = "#F07178" }
perm_exec = { fg = "#AAD94C" }
perm_sep = { fg = "#626A73" }
progress_label = { fg = "#B3B1AD", bold = true }
progress_normal = { fg = "#39BAE6", bg = "#313244" }
progress_error = { fg = "#F07178", bg = "#313244" }

[input]
border = { fg = "#39BAE6" }
title = { fg = "#39BAE6", bg = "#0A0E14", bold = true }
value = { fg = "#B3B1AD", bg = "#0A0E14" }
selected = { reversed = true }

[pick]
border = { fg = "#39BAE6" }
active = { fg = "#A68EA4" }
inactive = { fg = "#626A73", bg = "#0A0E14" }

[cmp]
border = { fg = "#39BAE6" }
active = { fg = "#A68EA4" }
inactive = { fg = "#626A73", bg = "#0A0E14" }

[tasks]
border = { fg = "#39BAE6" }
title = { fg = "#39BAE6", bg = "#0A0E14", bold = true }
hovered = { bg = "#313244", underline = true }

[which]
mask = { bg = "#313244" }
cand = { fg = "#95E6CB" }
rest = { fg = "#626A73" }
desc = { fg = "#A68EA4" }
separator = "  "
separator_style = { fg = "#626A73" }

[help]
on = { fg = "#95E6CB" }
run = { fg = "#A68EA4" }
desc = { fg = "#B3B1AD", bg = "#0A0E14" }
hovered = { bg = "#313244", bold = true }
footer = { fg = "#0A0E14", bg = "#B3B1AD" }

[git]
modified = { fg = "#FFB454" }
untracked = { fg = "#A68EA4" }
added = { fg = "#AAD94C" }
deleted = { fg = "#F07178" }
updated = { fg = "#39BAE6" }
ignored = { fg = "#626A73" }

[filetype]
rules = [
    { url = "*/", fg = "#39BAE6", bold = true },
    { url = "*.rs", fg = "#FF8F40" },
    { url = "*.py", fg = "#FFB454" },
    { url = "*.js", fg = "#FFB454" },
    { url = "*.ts", fg = "#39BAE6" },
    { url = "*.sh", fg = "#AAD94C" },
    { url = "*.toml", fg = "#95E6CB" },
    { url = "*.yaml", fg = "#95E6CB" },
    { url = "*.yml", fg = "#95E6CB" },
    { url = "*.json", fg = "#95E6CB" },
    { url = "*.kdl", fg = "#95E6CB" },
    { url = "*.html", fg = "#FF8F40" },
    { url = "*.css", fg = "#39BAE6" },
    { url = "*.md", fg = "#B3B1AD" },
    { url = "*.tex", fg = "#AAD94C" },
    { url = "*.typ", fg = "#AAD94C" },
    { url = "*.pdf", fg = "#F07178" },
    { url = "*.png", fg = "#A68EA4" },
    { url = "*.jpg", fg = "#A68EA4" },
    { url = "*.jpeg", fg = "#A68EA4" },
    { url = "*.gif", fg = "#A68EA4" },
    { url = "*.svg", fg = "#A68EA4" },
    { url = "*.zip", fg = "#FF8F40" },
    { url = "*.tar*", fg = "#FF8F40" },
    { url = "*.gz", fg = "#FF8F40" },
    { url = "*.gitignore", fg = "#626A73" },
    { url = ".env*", fg = "#F07178" },
    { url = "Dockerfile*", fg = "#39BAE6" },
    { url = "Makefile", fg = "#AAD94C" },
    { url = "Cargo.toml", fg = "#FF8F40", bold = true },
    { url = "Cargo.lock", fg = "#626A73" },
]
