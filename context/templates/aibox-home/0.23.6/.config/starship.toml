# aibox starship config — arrow preset (powerline chevron/airline style)
# Requires a Nerd Font or Powerline-patched font for the arrow separators (e0b0/e0b2).
palette = "aibox"

format = """
[](fg:#88C0D0)\
$directory\
[](fg:#88C0D0 bg:#A3BE8C)\
$git_branch\
$git_status\
[](fg:#A3BE8C bg:#2E3440)\
 $cmd_duration\
$line_break\
$character"""

[directory]
style = "bold bg:#88C0D0 fg:#2E3440"
format = "[ $path ]($style)"
truncation_length = 3
truncate_to_repo = true

[git_branch]
style = "bg:#A3BE8C fg:#2E3440"
symbol = " "
format = "[ $symbol$branch ]($style)"

[git_status]
style = "bg:#A3BE8C fg:#2E3440"
format = "[$all_status$ahead_behind]($style)"
ahead = "⇡$count"
behind = "⇣$count"
diverged = "⇕⇡$ahead_count⇣$behind_count"
modified = "!$count"
staged = "+$count"
untracked = "?$count"

[cmd_duration]
style = "fg:#4C566A"
min_time = 2_000
format = "[ $duration]($style)"

[character]
success_symbol = "[❯](bold fg:#88C0D0)"
error_symbol = "[❯](bold fg:#BF616A)"

[python]
style = "fg:#EBCB8B"
format = "[$symbol$version]($style) "
[rust]
style = "fg:#D08770"
format = "[$symbol$version]($style) "
[nodejs]
style = "fg:#A3BE8C"
format = "[$symbol$version]($style) "
[golang]
style = "fg:#81A1C1"
format = "[$symbol$version]($style) "

[palettes.aibox]
bg = "#2E3440"
fg = "#D8DEE9"
accent = "#88C0D0"
