# aibox tmux configuration
set -g default-shell /bin/bash
set -g default-command /bin/bash
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g mouse on
set -g history-limit 50000
set -g escape-time 10
set -g focus-events on
set -g allow-passthrough on
set -g default-terminal "tmux-256color"
set -ga terminal-features ",xterm-256color:RGB,tmux-256color:RGB"
set -ga terminal-overrides ",xterm-256color:Tc,tmux-256color:Tc"
set -g status-interval 10
set -g prefix C-g
unbind C-b
bind C-g send-prefix

# Pane navigation mirrors the old aibox leader muscle memory.
bind-key -N "Show aibox/tmux key bindings" ? display-popup -w 80% -h 75% -E "tmux list-keys -N | less -R"
bind-key -N "Select pane left" h select-pane -L
bind-key -N "Select pane down / next harness pane" j select-pane -D
bind-key -N "Select pane up / prev harness pane" k select-pane -U
bind-key -N "Select pane right" l select-pane -R
bind-key -N "Split pane right" r split-window -h -c "#{pane_current_path}"
bind-key -N "Split pane down" d split-window -v -c "#{pane_current_path}"
bind-key -N "Kill pane" x kill-pane
bind-key -N "Toggle pane zoom" f resize-pane -Z
bind-key -N "Toggle pane zoom (alias)" z resize-pane -Z
bind-key -N "Kill tmux session" q confirm-before -p "kill tmux session aibox? (y/n)" kill-session
bind-key -N "Reload tmux config" R source-file ~/.config/tmux/tmux.conf \; display-message "aibox tmux config reloaded"
bind-key -N "Open log pane (lnav)" L display-popup -E -w 90% -h 80% "aibox-log-viewer"

# BR-TOOLS-AS-WINDOWS (BACK-20260510_0726-GrandDaisy, v0.25.7): one-letter
# prefix shortcuts to jump directly to named tool/harness windows.
# find-window -Z focuses the target window; silently no-ops when absent.
bind-key -N "Switch to lazygit window" g find-window -Z 'lazygit'
bind-key -N "Switch to shell window" s find-window -Z 'shell'

set -g status on
set -g status-style "bg=#2E3440,fg=#D8DEE9"
set -g window-status-current-style "bg=#88C0D0,fg=#2E3440,bold"
set -g window-status-format " #I:#W "
set -g window-status-current-format " #I:#W "
set -g status-left " #S #{W:#I:#W ,#[reverse]#I:#W#[noreverse] }"
set -g status-left-length 80
set -g status-right " #(aibox-status --once 2>/dev/null || true) %H:%M "

# Powerkit status.
set -g @powerkit_plugins "aibox_log,aibox_oom,aibox_proc,aibox_ai,aibox_mcp,aibox_mig,weather,uptime,datetime,git,github,kubernetes,terraform,cloud,hostname,externalip,ssh,netspeed,ping,cpu,loadavg,memory,swap,disk,gpu"
set -g @powerkit_bar_layout "double"
set -g @powerkit_status_order "session,plugins"
set -g @powerkit_theme "nord"
set -g @powerkit_theme_variant "dark"
set -g @powerkit_separator_style "rounded"
set -g @powerkit_elements_spacing "both"
set -g @powerkit_status_interval "10"
set -g @powerkit_transparent "false"
set -g @powerkit_pane_border_status "top"
set -g @powerkit_pane_border_format "#{?client_prefix,PREFIX,NORMAL} #{pane_title} #{pane_current_command}"
set -g @powerkit_line1_right "aibox_log,aibox_oom,aibox_proc,aibox_ai,aibox_mcp,aibox_mig,weather,uptime,datetime"
set -g @powerkit_line2_left "git,github,kubernetes,terraform,cloud"
set -g @powerkit_line2_right "hostname,externalip,ssh,netspeed,ping,cpu,loadavg,memory,swap,disk,gpu"
set -g @powerkit_plugin_netspeed_speed_width "7"
set -g @powerkit_plugin_aibox_log_metric "log"
set -g @powerkit_plugin_aibox_log_cache_ttl "30"
set -g @powerkit_plugin_aibox_oom_metric "oom"
set -g @powerkit_plugin_aibox_oom_cache_ttl "30"
set -g @powerkit_plugin_aibox_proc_metric "proc"
set -g @powerkit_plugin_aibox_proc_cache_ttl "30"
set -g @powerkit_plugin_aibox_ai_metric "ai"
set -g @powerkit_plugin_aibox_ai_cache_ttl "30"
set -g @powerkit_plugin_aibox_mcp_metric "mcp"
set -g @powerkit_plugin_aibox_mcp_cache_ttl "30"
set -g @powerkit_plugin_aibox_mig_metric "mig"
set -g @powerkit_plugin_aibox_mig_cache_ttl "30"
set -g @powerkit_plugin_netspeed_cache_ttl "10"
set -g @powerkit_plugin_kubernetes_cache_ttl "120"
set -g @powerkit_plugin_cloud_cache_ttl "120"
set -g @powerkit_plugin_aibox_log_label "󱖫"
set -g @powerkit_plugin_aibox_oom_label "󰍛󰚌"
set -g @powerkit_plugin_aibox_proc_label "󰊚"
set -g @powerkit_plugin_aibox_ai_label "󱙺"
set -g @powerkit_plugin_aibox_mcp_label "󰌹"
set -g @powerkit_plugin_aibox_mig_label "󰚰"
set -g @powerkit_plugin_kubernetes_icon "󱃾"
set -g @powerkit_plugin_cloud_icon "󰅣"
set -g @powerkit_plugin_cloud_icon_aws "󰸏"
set -g @powerkit_plugin_cloud_icon_gcp "󰬠"
set -g @powerkit_plugin_cloud_icon_azure "󰠅"
set -g @powerkit_plugin_cloud_icon_multi "󰅤"
set -g @powerkit_plugin_uptime_icon ""
set -g @powerkit_plugin_netspeed_icon ""
set -g @powerkit_plugin_netspeed_icon_download "󰇚"
set -g @powerkit_plugin_netspeed_icon_upload "󰕒"

# aibox-managed plugins are installed and pinned by the runtime image. TPM is
# only a user convenience layer for additional personal plugins.
if-shell '[ -f /usr/local/share/aibox/tmux/plugins/tmux-sensible/sensible.tmux ]' 'run-shell /usr/local/share/aibox/tmux/plugins/tmux-sensible/sensible.tmux'
if-shell '[ -f /usr/local/share/aibox/tmux/plugins/tmux-powerkit/tmux-powerkit.tmux ]' 'run-shell /usr/local/share/aibox/tmux/plugins/tmux-powerkit/tmux-powerkit.tmux'
if-shell '[ -f /usr/local/share/aibox/tmux/plugins/vim-tmux-navigator/vim-tmux-navigator.tmux ]' 'run-shell /usr/local/share/aibox/tmux/plugins/vim-tmux-navigator/vim-tmux-navigator.tmux'
if-shell '[ -f /usr/local/share/aibox/tmux/plugins/tmux-yank/yank.tmux ]' 'run-shell /usr/local/share/aibox/tmux/plugins/tmux-yank/yank.tmux'

# Powerkit renders these list-specific sections; tmux only supplies alignment.
set -g status 2
set -g 'status-format[0]' '#[align=left range=left #{E:status-left-style}]#[push-default]#(~/.local/bin/aibox-powerkit-render-session)#[pop-default]#[norange default]#[list=on align=#{status-justify}]#[list=left-marker]<#[list=right-marker]>#[list=on]#{W:#[range=window|#{window_index} #{E:window-status-style}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}}]#[push-default]#{T:window-status-format}#[pop-default]#[norange default]#{?loop_last_flag,,#{window-status-separator}},#[range=window|#{window_index} list=focus #{?#{!=:#{E:window-status-current-style},default},#{E:window-status-current-style},#{E:window-status-style}}}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}}]#[push-default]#{T:window-status-current-format}#[pop-default]#[norange list=on default]#{?loop_last_flag,,#{window-status-separator}}}#{E:@_powerkit_left_edge_sep}#[nolist align=right range=right #{E:status-right-style}]#[push-default]#(~/.local/bin/aibox-powerkit-render-list right aibox_log,aibox_oom,aibox_proc,aibox_ai,aibox_mcp,aibox_mig,weather,uptime,datetime)#[pop-default]#[norange default]'
set -g 'status-format[1]' '#[align=left]#(~/.local/bin/aibox-powerkit-render-list left git,github,kubernetes,terraform,cloud)#[align=right]#(~/.local/bin/aibox-powerkit-render-list right hostname,externalip,ssh,netspeed,ping,cpu,loadavg,memory,swap,disk,gpu)'

# Persistence plugins are installed for later policy work but disabled by
# default in v0.25.0. Do not enable continuum/resurrect implicitly.
set -g @continuum-restore 'off'
set -g @continuum-save-interval '0'
set -g @resurrect-capture-pane-contents 'off'

if-shell '[ -x ~/.tmux/plugins/tpm/tpm ]' 'run-shell ~/.tmux/plugins/tpm/tpm'
