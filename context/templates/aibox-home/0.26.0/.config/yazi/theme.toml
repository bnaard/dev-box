# =============================================================================
# Yazi theme — generated by aibox CLI from the active theme palette
# Docs: https://yazi-rs.github.io/docs/configuration/theme
# =============================================================================

[mgr]
cwd = { fg = "#88C0D0" }
hovered = { fg = "#2E3440", bg = "#D8DEE9" }
preview_hovered = { bg = "#3B4252", underline = true }
find_keyword = { fg = "#EBCB8B", bold = true }
find_position = { fg = "#A98792", italic = true }
marker_selected = { fg = "#A3BE8C", bg = "#A3BE8C" }
marker_copied = { fg = "#88C0D0", bg = "#88C0D0" }
marker_cut = { fg = "#BF616A", bg = "#BF616A" }

[tabs]
active = { fg = "#2E3440", bg = "#88C0D0", bold = true }
inactive = { fg = "#4C566A", bg = "#3B4252" }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[mode]
normal_main = { fg = "#2E3440", bg = "#A3BE8C", bold = true }
normal_alt = { fg = "#A3BE8C", bg = "#3B4252", bold = true }
select_main = { fg = "#2E3440", bg = "#88C0D0", bold = true }
select_alt = { fg = "#88C0D0", bg = "#3B4252", bold = true }
unset_main = { fg = "#2E3440", bg = "#A98792", bold = true }
unset_alt = { fg = "#A98792", bg = "#3B4252", bold = true }

[status]
overall = { fg = "#D8DEE9", bg = "#3B4252" }
sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }
perm_type = { fg = "#88C0D0" }
perm_read = { fg = "#EBCB8B" }
perm_write = { fg = "#BF616A" }
perm_exec = { fg = "#A3BE8C" }
perm_sep = { fg = "#4C566A" }
progress_label = { fg = "#D8DEE9", bold = true }
progress_normal = { fg = "#88C0D0", bg = "#3B4252" }
progress_error = { fg = "#BF616A", bg = "#3B4252" }

[input]
border = { fg = "#88C0D0" }
title = { fg = "#88C0D0", bg = "#2E3440", bold = true }
value = { fg = "#D8DEE9", bg = "#2E3440" }
selected = { reversed = true }

[pick]
border = { fg = "#88C0D0" }
active = { fg = "#A98792" }
inactive = { fg = "#4C566A", bg = "#2E3440" }

[cmp]
border = { fg = "#88C0D0" }
active = { fg = "#A98792" }
inactive = { fg = "#4C566A", bg = "#2E3440" }

[tasks]
border = { fg = "#88C0D0" }
title = { fg = "#88C0D0", bg = "#2E3440", bold = true }
hovered = { bg = "#3B4252", underline = true }

[which]
mask = { bg = "#3B4252" }
cand = { fg = "#81A1C1" }
rest = { fg = "#4C566A" }
desc = { fg = "#A98792" }
separator = "  "
separator_style = { fg = "#4C566A" }

[help]
on = { fg = "#81A1C1" }
run = { fg = "#A98792" }
desc = { fg = "#D8DEE9", bg = "#2E3440" }
hovered = { bg = "#3B4252", bold = true }
footer = { fg = "#2E3440", bg = "#D8DEE9" }

[git]
modified = { fg = "#EBCB8B" }
untracked = { fg = "#A98792" }
added = { fg = "#A3BE8C" }
deleted = { fg = "#BF616A" }
updated = { fg = "#88C0D0" }
ignored = { fg = "#4C566A" }

[filetype]
rules = [
    { url = "*/", fg = "#88C0D0", bold = true },
    { url = "*.rs", fg = "#D08770" },
    { url = "*.py", fg = "#EBCB8B" },
    { url = "*.js", fg = "#EBCB8B" },
    { url = "*.ts", fg = "#88C0D0" },
    { url = "*.sh", fg = "#A3BE8C" },
    { url = "*.toml", fg = "#81A1C1" },
    { url = "*.yaml", fg = "#81A1C1" },
    { url = "*.yml", fg = "#81A1C1" },
    { url = "*.json", fg = "#81A1C1" },
    { url = "*.kdl", fg = "#81A1C1" },
    { url = "*.html", fg = "#D08770" },
    { url = "*.css", fg = "#88C0D0" },
    { url = "*.md", fg = "#D8DEE9" },
    { url = "*.tex", fg = "#A3BE8C" },
    { url = "*.typ", fg = "#A3BE8C" },
    { url = "*.pdf", fg = "#BF616A" },
    { url = "*.png", fg = "#A98792" },
    { url = "*.jpg", fg = "#A98792" },
    { url = "*.jpeg", fg = "#A98792" },
    { url = "*.gif", fg = "#A98792" },
    { url = "*.svg", fg = "#A98792" },
    { url = "*.zip", fg = "#D08770" },
    { url = "*.tar*", fg = "#D08770" },
    { url = "*.gz", fg = "#D08770" },
    { url = "*.gitignore", fg = "#4C566A" },
    { url = ".env*", fg = "#BF616A" },
    { url = "Dockerfile*", fg = "#88C0D0" },
    { url = "Makefile", fg = "#A3BE8C" },
    { url = "Cargo.toml", fg = "#D08770", bold = true },
    { url = "Cargo.lock", fg = "#4C566A" },
]
