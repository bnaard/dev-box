# Generated by aibox — do not edit manually.
# To modify, edit aibox.toml and run: aibox apply
#
# =============================================================================
# HOW TO CUSTOMIZE:
#   Do NOT edit this file directly — it is regenerated by `aibox apply`.
#   To add ports/volumes/env vars: use docker-compose.override.yml
#   To change user:     set user in aibox.toml [container], run `aibox apply`
#
# VOLUME MOUNT STRATEGY:
#   Config files (vim, tmux, yazi, git, AI tools) are mounted read-write from
#   the host-side .aibox-home/ directory so changes persist across rebuilds.
#   The workspace (project root) is mounted at /workspace inside the container.
#   SSH keys are mounted read-only for security.
# =============================================================================
#
name: aibox

services:
  aibox:
    build:
      context: .
      dockerfile: Dockerfile
    image: aibox-devcontainer:latest
    container_name: aibox
    hostname: aibox
    init: true
    # Codex CLI uses bubblewrap for Linux sandboxing. Some container
    # runtime seccomp profiles block unprivileged user namespace creation
    # before bubblewrap can set up its own sandbox. This narrow fallback
    # avoids privileged=true and SYS_ADMIN.
    security_opt:
      - seccomp=unconfined
    stdin_open: true
    tty: true
    working_dir: /workspace
    volumes:
      # Workspace (project root)
      - ${WORKSPACE_DIR:-..}:/workspace
      # SSH keys (read-only — mount from host)
      - ../.aibox-home/.ssh:/home/aibox/.ssh:ro
      # Vim configuration (vimrc + undo only — colorschemes stay from image)
      - ../.aibox-home/.vim/vimrc:/home/aibox/.vim/vimrc
      - ../.aibox-home/.vim/undo:/home/aibox/.vim/undo
      # tmux terminal multiplexer config and plugin state
      - ../.aibox-home/.config/tmux:/home/aibox/.config/tmux
      - ../.aibox-home/.tmux:/home/aibox/.tmux
      # XDG cache home. This must be mounted as a writable parent, not only as
      # selected subdirectories, because tools such as uv and starship create
      # their own cache/log directories at runtime.
      - ../.aibox-home/.cache:/home/aibox/.cache
      # Yazi file manager config
      - ../.aibox-home/.config/yazi:/home/aibox/.config/yazi
      # Git configuration
      - ../.aibox-home/.config/git:/home/aibox/.config/git
      # XDG state for TUIs such as lazygit
      - ../.aibox-home/.config/state:/home/aibox/.config/state
      # aibox-managed helper scripts (resource status, preview helpers)
      - ../.aibox-home/.local/bin:/home/aibox/.local/bin
      # OpenAI Codex CLI configuration and cached login state
      - ../.aibox-home/.codex:/home/aibox/.codex
      # ALSA → PulseAudio bridge config
      - ../.aibox-home/.asoundrc:/home/aibox/.asoundrc
      # Cargo registry cache — avoids re-downloading crates on rebuild.
      # Only registry/ and git/ are mounted; bin/ stays in the image (host binaries
      # won't run in the container).
      - ../.aibox-home/.cargo/registry:/home/aibox/.cargo/registry
      - ../.aibox-home/.cargo/git:/home/aibox/.cargo/git
    env_file:
      # Credentials from .aibox-local.toml — gitignored, never committed.
      # Re-generated by `aibox apply`; may be empty when no local overlay exists.
      - ../.aibox-local.env
    environment:
      AUDIODRIVER: "pulseaudio"
      COLORTERM: "truecolor"
      GIT_CONFIG_GLOBAL: "/home/aibox/.config/git/config"
      LANG: "en_US.UTF-8"
      PULSE_SERVER: "tcp:host.docker.internal:4714"
      SHELL: "/bin/bash"
      TERM: "xterm-256color"
      TZ: "Europe/Berlin"
      # Terminal-emulator detection passthrough. Lets TUIs inside the container
      # (yazi, vim, lazygit, …) detect the host terminal and skip startup CSI
      # capability probes that otherwise time out and flash error messages
      # ("Terminal response timeout" in yazi; cursor-position garble in vim).
      # The "${VAR-}" form forwards the host's value, defaulting to empty when
      # the var is unset, so it works whatever terminal emulator the user runs.
      TERM_PROGRAM: "${TERM_PROGRAM-}"
      TERM_PROGRAM_VERSION: "${TERM_PROGRAM_VERSION-}"
      KITTY_WINDOW_ID: "${KITTY_WINDOW_ID-}"
      KITTY_PUBLIC_KEY: "${KITTY_PUBLIC_KEY-}"
      WEZTERM_PANE: "${WEZTERM_PANE-}"
      WEZTERM_EXECUTABLE: "${WEZTERM_EXECUTABLE-}"
      WEZTERM_CONFIG_FILE: "${WEZTERM_CONFIG_FILE-}"
      ITERM_SESSION_ID: "${ITERM_SESSION_ID-}"
      ITERM_PROFILE: "${ITERM_PROFILE-}"
      GHOSTTY_RESOURCES_DIR: "${GHOSTTY_RESOURCES_DIR-}"
      ALACRITTY_LOG: "${ALACRITTY_LOG-}"
      ALACRITTY_SOCKET: "${ALACRITTY_SOCKET-}"
      KONSOLE_VERSION: "${KONSOLE_VERSION-}"
      KONSOLE_DBUS_SERVICE: "${KONSOLE_DBUS_SERVICE-}"
      VTE_VERSION: "${VTE_VERSION-}"
      WT_SESSION: "${WT_SESSION-}"
      WT_PROFILE_ID: "${WT_PROFILE_ID-}"
      FOOT_VERSION: "${FOOT_VERSION-}"
      HYPER_VERSION: "${HYPER_VERSION-}"
      XTERM_VERSION: "${XTERM_VERSION-}"
      VSCODE_INJECTION: "${VSCODE_INJECTION-}"
    command: sleep infinity

  aibox-diagnostics:
    image: aibox-devcontainer:latest
    container_name: aibox-diagnostics
    hostname: aibox-diagnostics
    user: root
    init: true
    pid: "service:aibox"
    depends_on:
      - aibox
    working_dir: /workspace
    pids_limit: 64
    mem_limit: 64m
    cpus: 0.20
    restart: "on-failure:3"
    volumes:
      - ${WORKSPACE_DIR:-..}:/workspace
    command:
      - /usr/local/bin/aibox-diagnostics
      - --watch
      - --output
      - /workspace/.aibox/diagnostics