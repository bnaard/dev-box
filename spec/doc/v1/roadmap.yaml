schemaVersion: projectious.work/roadmap/v1
product: aibox
majorLine: v1
groups:
  - label: Foundation
    note: accepted product and contract boundary
    phases:
      - id: "0"
        title: Product and engineering specification
        summary: >-
          Accept the thin secure-control boundary, standard Dev Container
          artifact model, internal runtime adapters, native escape hatches,
          target execution and security design, acceptance journeys, and
          implementation sequence.
        status: in_progress
        decisions:
          - DEC-20260823_1428-CalmWolf-define-aibox-v1-x-rewrite-architecture
          - DEC-20260824_1056-SoundSpruce-define-managed-container-targets-and-script
      - id: "1"
        title: Go application foundation
        summary: >-
          Establish the host CLI and optional aiboxctl modules, command shell,
          typed results, process/filesystem boundaries, developer tooling,
          tests, and Linux/macOS builds.
        status: planned
        dependencies: ["0"]
      - id: "2"
        title: Owned contracts and deterministic migration
        summary: >-
          Publish schemas and fixtures for deployment intent, local bindings,
          locks, saved plans, adapter capabilities, machine results, storage,
          and runtime-capability-driver registries; implement effective configuration
          and deterministic v0 diagnosis and migration.
        status: planned
        dependencies: ["1"]
      - id: "3"
        title: Standard definition and runtime adoption
        summary: >-
          Validate standard Dev Container Templates and definitions, local and
          OCI Features, images and native files; adopt the official Dev
          Container CLI; establish internal adapter conformance; lock immutable
          inputs; and produce secret-free saved plans. DevPod is excluded.
        status: planned
        dependencies: ["2"]

  - label: Local lifecycle
    note: first useful Docker-compatible workflow
    phases:
      - id: "4"
        title: Dev Container CLI build and local Compose lifecycle
        summary: >-
          Build through the official Dev Container CLI and standard
          Dockerfile/BuildKit inputs, invoke Compose through internal Go
          adapters for saved-plan apply/start/stop/destroy, probe local engine
          capabilities, and prove readiness, evidence, and exact cleanup.
        status: planned
        dependencies: ["3"]
      - id: "5"
        title: Interactive exec and runtime controller
        summary: >-
          Add protected exec/attach, dedicated tmux workspace startup, and the
          optional bounded aiboxctl CLI/MCP application with template-installed
          runtime capability drivers, POSIX-shell-first fixed actions, and no
          domain-specific controller code.
        status: planned
        dependencies: ["4"]

  - label: Remote and cluster targets
    note: native tools execute at explicit authority boundaries
    phases:
      - id: "6"
        title: Remote Compose over SSH
        summary: >-
          Transfer verified staged native inputs, source, and explicit overrides; execute
          Compose on remote hosts; use SSH-protected engine exec/attach; and
          provide interruption recovery and exact cleanup.
        status: planned
        dependencies: ["4", "5"]
      - id: "7"
        title: Kubernetes manifests and exec/attach
        summary: >-
          Validate project-owned manifests/Kustomize overlays, evaluate
          envbuilder for conforming builds, apply through Kubernetes-native
          adapters from an authorized client, validate context/namespace/
          resources/readiness, and support exec/attach without Pod SSH.
        status: planned
        dependencies: ["3"]
      - id: "8"
        title: Ainfra target handover consumer
        summary: >-
          Consume and verify the versioned non-secret ainfra target projection,
          including capabilities, endpoints, access paths, provider and trust
          references, provenance binding, and compatibility diagnostics.
        status: idea
        dependencies: ["6", "7"]
      - id: "9"
        title: Managed-container target adapter
        summary: >-
          Qualify and implement the internal adapter contract for platforms
          whose atomic operation allocates capacity and creates the declared
          OCI workload; use Vast.ai as the reference evaluation, keep platform
          deployment credentials outside workloads, and prove plan-bound cost,
          interruption, readiness, access, storage, and exact deletion effects.
        status: idea
        dependencies: ["3", "4"]

  - label: Secret providers and delivery
    note: provider and exposure scope remain orthogonal
    phases:
      - id: "10"
        title: SOPS user-mediated secrets
        summary: >-
          Integrate host/remote SOPS with OS-keychain or declared identities,
          temporary Compose environment inputs, exec-scoped environment,
          mounted-file lifecycle, BuildKit secrets, redaction, and recovery.
        status: planned
        dependencies: ["4", "5", "6"]
      - id: "11"
        title: OpenBao brokered secrets
        summary: >-
          Support standard OpenBao API, Agent, and Kubernetes integration for
          local, remote, interactive, headless, renewable, and audited secret
          delivery without making aibox or aiboxctl a vault.
        status: planned
        dependencies: ["7", "10"]

  - label: Authoring and ecosystem
    note: standard Templates and Features own environment content
    phases:
      - id: "12"
        title: Template authoring and clean-room conformance
        summary: >-
          Publish upstream-compatible examples, local/OCI Feature guidance,
          native override and runtime-capability-driver conventions, tests, and human/AI
          documentation; prove clean-room authoring without engine source or a
          proprietary content DSL.
        status: planned
        dependencies: ["5", "7", "9", "11"]
      - id: "13"
        title: Initial certified template set
        summary: >-
          Certify useful interactive, autonomous headless-service, and batch
          templates across local and remote Compose, Kubernetes, and a
          managed-container target while treating processkit, harnesses,
          editors, previews, themes, and toolchains as standard Features or
          native configuration.
        status: idea
        dependencies: ["12"]
      - id: "14"
        title: Public documentation and read-only MCP resources
        summary: >-
          Publish version-aligned human and AI-readable product documentation,
          generative discovery, schemas, and a read-only MCP resource server
          under the company open-source standards.
        status: planned
        dependencies: ["12"]

  - label: Agent interface
    note: guarded operations over the shared application core
    phases:
      - id: "15"
        title: Guarded MCP lifecycle interface
        summary: >-
          Make MCP the primary agent experience with read-only defaults and
          explicit planning, build, deployment, connection, and destruction
          capabilities; preserve complete CLI parity, durable operation
          identity, independent authorization, target containment, typed next
          actions, prompt/tool attack defenses, and lost-session recovery;
          prove that aibox manages only distinct environments and never adds a
          bridge to its creator, while aiboxctl remains current-environment-
          only and exposes only bounded capability-driver tools.
        status: planned
        dependencies: ["6", "7", "9", "11", "12", "14"]

  - label: Hardening and release
    note: evidence-backed v1 availability
    phases:
      - id: "16"
        title: Compatibility, recovery, and security hardening
        summary: >-
          Complete the Docker Desktop, OrbStack, Podman, remote-host,
          Kubernetes, managed-container, autonomous-service, and batch
          matrices; adversarial and failure tests; migrations; evidence; and
          host-gated conformance.
        status: planned
        dependencies: ["11", "12"]
      - id: "17"
        title: v1 prerelease and stable promotion
        summary: >-
          Produce signed/attested Linux and macOS artifacts, SBOMs, migration
          guidance, release-aligned documentation, and disposable acceptance
          evidence, then promote through the company version-line workflow.
        status: planned
        dependencies: ["15", "16"]

  - label: Confidential workloads
    note: future attested infrastructure and secret release
    phases:
      - id: "18"
        title: Confidential computing and live attestation
        summary: >-
          Consume ainfra confidential target handover, bind measured workload
          identity and reference-value policy to deployment, verify fresh live
          or remote attestation, and integrate attestation-gated KBS secret
          release without moving infrastructure or secret authority into
          aibox.
        status: idea
        dependencies: ["8", "17"]
