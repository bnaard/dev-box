name: go
version: "1.0.0"
description: "Go programming language toolchain"
profile_intent: build
usage_class: automated
profiles: ["human-dev", "headless-runner"]
exported_surfaces: ["language-runtime", "build-toolchain", "cli-binary"]
builder_weight: null

skills:
  - go-conventions
  - concurrency-patterns

tools:
  - name: go
    description: "Go compiler, tooling, and module workflow"
    default_enabled: true
    default_version: "1.26"
    supported_versions: ["1.25", "1.26"]

builder: null

runtime: |
  # Addon: go (runtime)
  RUN ARCH=$(dpkg --print-architecture) && \
      GO_VERSION="{{ tools.go.version }}" && \
      curl -fsSL "https://go.dev/dl/go${GO_VERSION}.linux-${ARCH}.tar.gz" \
        -o /tmp/go.tar.gz && \
      curl -fsSL "https://go.dev/dl/go${GO_VERSION}.linux-${ARCH}.tar.gz.sha256" \
        -o /tmp/go.tar.gz.sha256 && \
      echo "$(cat /tmp/go.tar.gz.sha256)  /tmp/go.tar.gz" | sha256sum -c && \
      tar -xz -C /usr/local -f /tmp/go.tar.gz && \
      rm /tmp/go.tar.gz /tmp/go.tar.gz.sha256 && \
      ln -sf /usr/local/go/bin/* /usr/local/bin/

  ENV GOPATH="/home/aibox/go"
  ENV PATH="${GOPATH}/bin:${PATH}"
