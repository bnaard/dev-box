name: node
version: "1.0.0"
description: "Node.js runtime with pnpm, yarn, or bun"
profile_intent: runtime
usage_class: automated
profiles: ["human-dev", "headless-runner"]
exported_surfaces: ["language-runtime", "build-toolchain", "cli-binary"]
builder_weight: null

skills:
  - typescript-patterns
  - tailwind

tools:
  - name: node
    description: "Node.js JavaScript and TypeScript runtime"
    default_enabled: true
    default_version: "26"
    supported_versions: ["20", "22", "24", "26"]
  - name: pnpm
    description: "Fast disk-efficient Node package manager"
    default_enabled: true
    default_version: "11.10.0"
    supported_versions: ["9", "10", "11.1.3", "11.5.2", "11.10.0"]
  - name: yarn
    description: "Yarn Node package manager"
    default_enabled: false
    default_version: "4.17.0"
    supported_versions: ["4", "4.16.0", "4.17.0"]
  - name: bun
    description: "Bun JavaScript runtime, package manager, and test runner"
    default_enabled: false
    default_version: "1.3.14"
    supported_versions: ["1.2", "1.3.14"]

builder: null

runtime: |
  # Addon: node (runtime)
  RUN apt-get update && apt-get install -y --no-install-recommends ca-certificates curl gpg && \
      mkdir -p /etc/apt/keyrings && \
      curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key | gpg --dearmor -o /etc/apt/keyrings/nodesource.gpg && \
      echo "deb [signed-by=/etc/apt/keyrings/nodesource.gpg] https://deb.nodesource.com/node_{{ tools.node.version }}.x nodistro main" > /etc/apt/sources.list.d/nodesource.list && \
      apt-get update && apt-get install -y --no-install-recommends nodejs && \
      rm -rf /var/lib/apt/lists/*

  {% if tools.pnpm.enabled %}
  RUN npm install -g pnpm@{{ tools.pnpm.version }} && \
      npm cache clean --force
  {% endif %}
  {% if tools.yarn.enabled %}
  RUN corepack enable && \
      corepack prepare yarn@{{ tools.yarn.version }} --activate
  {% endif %}
  {% if tools.bun.enabled %}
  # Install bun via versioned release asset (avoids curl-pipe-bash).
  # Note: bun releases do not publish separate sha256 checksum files; version
  # pinning provides supply-chain integrity over the previous curl-pipe-bash method.
  RUN apt-get update && apt-get install -y --no-install-recommends unzip && \
      rm -rf /var/lib/apt/lists/* && \
      ARCH="$(uname -m | sed 's/x86_64/x64/;s/aarch64/aarch64/')" && \
      curl -fsSL "https://github.com/oven-sh/bun/releases/download/bun-v{{ tools.bun.version }}/bun-linux-${ARCH}.zip" -o /tmp/bun.zip && \
      unzip -q /tmp/bun.zip -d /tmp/bun-extracted && \
      mv /tmp/bun-extracted/bun-linux-${ARCH}/bun /usr/local/bin/bun && \
      chmod +x /usr/local/bin/bun && \
      rm -rf /tmp/bun.zip /tmp/bun-extracted
  {% endif %}
