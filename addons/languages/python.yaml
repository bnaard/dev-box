name: python
version: "1.0.0"
description: "Python runtime with uv, poetry, or pdm"
profile_intent: runtime
usage_class: automated
profiles: ["human-dev", "headless-runner"]
exported_surfaces: ["language-runtime", "build-toolchain", "cli-binary"]
builder_weight: null

# As of aibox v0.16.5 (DEC-036), python3 (Debian Trixie default, 3.13.x)
# and uv (0.11.11 from ghcr.io/astral-sh/uv) are unconditionally present
# in the base-debian image. This addon now provides ADDITIONAL Python
# tooling beyond that minimum: alternative Python versions (3.12, 3.14),
# poetry, pdm, and the recommended skills below.

skills:
  - python-best-practices
  - fastapi-patterns
  - pandas-polars

tools:
  - name: python
    default_enabled: true
    default_version: "3.13"
    supported_versions: ["3.12", "3.13", "3.14"]
  - name: uv
    default_enabled: true
    default_version: "0.11.11"
    supported_versions: ["0.7", "0.11.10", "0.11.11"]
  - name: pip
    default_enabled: false
    default_version: ""
    supported_versions: []
  - name: poetry
    default_enabled: false
    default_version: "2.0"
    supported_versions: ["1.8", "2.0"]
  - name: pdm
    default_enabled: false
    default_version: "2.22"
    supported_versions: ["2.22"]

builder: null

runtime: |
  # Addon: python (runtime)
  {% if tools.python.version != "3.13" or tools.pip.enabled %}
  RUN apt-get update && apt-get install -y --no-install-recommends \
  {% if tools.python.version != "3.13" %}
      python{{ tools.python.version }} \
  {% endif %}
  {% if tools.pip.enabled %}
      python3-pip \
  {% endif %}
      python3-venv \
      && rm -rf /var/lib/apt/lists/*
  {% endif %}

  {% if tools.uv.enabled and tools.uv.version != "0.11.11" %}
  COPY --from=ghcr.io/astral-sh/uv:{{ tools.uv.version }} /uv /usr/local/bin/uv
  COPY --from=ghcr.io/astral-sh/uv:{{ tools.uv.version }} /uvx /usr/local/bin/uvx
  {% endif %}

  {% if tools.poetry.enabled %}
  RUN apt-get update && apt-get install -y --no-install-recommends \
      python3-pip \
      && rm -rf /var/lib/apt/lists/*
  RUN pip3 install --no-cache-dir 'poetry~={{ tools.poetry.version }}.0'
  {% endif %}

  {% if tools.pdm.enabled %}
  RUN apt-get update && apt-get install -y --no-install-recommends \
      python3-pip \
      && rm -rf /var/lib/apt/lists/*
  RUN pip3 install --no-cache-dir 'pdm~={{ tools.pdm.version }}.0'
  {% endif %}
