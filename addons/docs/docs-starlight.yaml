name: docs-starlight
version: "1.0.0"
description: "Starlight – Astro-based docs site"
profile_intent: build
usage_class: automated
profiles: ["human-dev", "headless-runner"]
exported_surfaces: ["build-toolchain", "cli-binary"]
requires:
  - node

skills:
  - documentation

builder_weight: null

tools:
  - name: starlight
    description: "Astro-based documentation site framework"
    default_enabled: true
    default_version: ""
    supported_versions: []

builder: null

runtime: |
  # Addon: docs-starlight
  RUN npm install -g create-starlight && \
      npm cache clean --force
