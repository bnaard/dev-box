name: docs-zensical
version: "1.0.0"
description: "Zensical – Python docs site"
profile_intent: build
usage_class: automated
profiles: ["human-dev", "headless-runner"]
exported_surfaces: ["build-toolchain", "cli-binary"]
requires:
  - python

skills:
  - documentation

builder_weight: null

tools:
  - name: zensical
    default_enabled: true
    default_version: ""
    supported_versions: []

builder: null

runtime: |
  # Addon: docs-zensical
  RUN UV_CACHE_DIR=/tmp/aibox-uv-cache uv tool install zensical && \
      rm -rf /tmp/aibox-uv-cache
