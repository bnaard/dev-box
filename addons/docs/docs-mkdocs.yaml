name: docs-mkdocs
version: "1.0.0"
description: "MkDocs – Python Markdown docs site"
profile_intent: build
usage_class: automated
profiles: ["human-dev", "headless-runner"]
exported_surfaces: ["build-toolchain", "cli-binary"]
requires:
  - python

skills:
  - documentation

builder_weight: null

tools:
  - name: mkdocs
    description: "Python Markdown documentation site generator"
    default_enabled: true
    default_version: ""
    supported_versions: []

builder: null

runtime: |
  # Addon: docs-mkdocs
  RUN UV_CACHE_DIR=/tmp/aibox-uv-cache uv tool install 'mkdocs<2' --with mkdocs-material && \
      rm -rf /tmp/aibox-uv-cache
