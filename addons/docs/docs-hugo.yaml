name: docs-hugo
version: "1.0.0"
description: "Hugo static site generator (Go)"
profile_intent: build
usage_class: automated
profiles: ["human-dev", "headless-runner"]
exported_surfaces: ["build-toolchain", "cli-binary"]
skills:
  - documentation

builder_weight: null

tools:
  - name: hugo
    default_enabled: true
    default_version: ""
    supported_versions: []

builder: null

runtime: |
  # Addon: docs-hugo
  RUN ARCH="$(dpkg --print-architecture)" && \
      HUGO_VERSION="0.141.0" && \
      curl -fsSL \
        "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-${ARCH}.tar.gz" \
        -o /tmp/hugo.tar.gz && \
      curl -fsSL \
        "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_checksums.txt" \
        -o /tmp/hugo_checksums.txt && \
      grep "hugo_extended_${HUGO_VERSION}_linux-${ARCH}.tar.gz" /tmp/hugo_checksums.txt | sha256sum -c && \
      tar -xz -C /usr/local/bin -f /tmp/hugo.tar.gz hugo && \
      rm /tmp/hugo.tar.gz /tmp/hugo_checksums.txt
