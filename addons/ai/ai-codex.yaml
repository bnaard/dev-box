name: ai-codex
version: "1.1.0"
description: "OpenAI Codex CLI"
profile_intent: provider-cli
usage_class: manual-escalation-only
profiles: ["human-dev"]
exported_surfaces: ["cli-binary", "config-files"]
builder_weight: null
requires:
  - node

tools:
  - name: codex
    default_enabled: true
    default_version: ""
    supported_versions: []

builder: null

runtime: |
  # Addon: ai-codex
  # OpenAI Codex CLI: https://github.com/openai/codex
  # npm package: @openai/codex | Binary: codex | Config: ~/.codex/
  # Auth: OPENAI_API_KEY (or ChatGPT Plus/Pro/Team/Enterprise account)
  # To pin a version: set [ai.harness.codex] version in aibox.toml
  {% if tools.codex.version %}
  RUN npm install -g @openai/codex@{{ tools.codex.version }}
  {% else %}
  RUN npm install -g @openai/codex
  {% endif %}
