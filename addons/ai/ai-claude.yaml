name: ai-claude
version: "1.0.0"
description: "Claude Code CLI (Anthropic)"
profile_intent: provider-cli
usage_class: manual-escalation-only
profiles: ["human-dev"]
exported_surfaces: ["cli-binary", "config-files"]
builder_weight: null

tools:
  - name: claude
    description: "Anthropic Claude Code CLI"
    default_enabled: true
    default_version: ""
    supported_versions: []

builder: null

runtime: |
  # Addon: ai-claude
  # Install Claude Code CLI from Anthropic's signed Debian repository.
  # The native home-directory installer writes to ~/.local/bin and ~/.claude;
  # both are runtime mounts in aibox projects, so a system package is more
  # stable for containers and avoids stale home-owned symlinks.
  # Ref: https://code.claude.com/docs/en/setup#install-with-linux-package-managers
  RUN set -eux; \
      install -d -m 0755 /etc/apt/keyrings; \
      curl -fsSL https://downloads.claude.ai/keys/claude-code.asc \
        -o /etc/apt/keyrings/claude-code.asc; \
      echo "deb [signed-by=/etc/apt/keyrings/claude-code.asc] https://downloads.claude.ai/claude-code/apt/{% if tools.claude.version == "stable" %}stable stable{% else %}latest latest{% endif %} main" \
        > /etc/apt/sources.list.d/claude-code.list; \
      apt-get update; \
      apt-get install -y --no-install-recommends {% if tools.claude.version and tools.claude.version != "latest" and tools.claude.version != "stable" %}claude-code={{ tools.claude.version }}{% else %}claude-code{% endif %}; \
      rm -rf /var/lib/apt/lists/*; \
      claude_path="$(command -v claude)"; \
      claude_real="$(readlink -f "$claude_path")"; \
      install -m 0755 "$claude_real" /usr/local/bin/claude; \
      /usr/local/bin/claude --version
