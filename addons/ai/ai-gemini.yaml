name: ai-gemini
version: "1.0.0"
description: "Google Gemini CLI"
profile_intent: provider-cli
usage_class: manual-escalation-only
profiles: ["human-dev"]
exported_surfaces: ["cli-binary", "config-files"]
builder_weight: null

tools:
  - name: gemini
    description: "Google Gemini CLI"
    default_enabled: true
    default_version: ""
    supported_versions: []

builder: null

runtime: |
  # Addon: ai-gemini
  # Official Google Gemini CLI: https://github.com/google-gemini/gemini-cli
  {% if tools.gemini.version %}
  RUN npm install -g @google/gemini-cli@{{ tools.gemini.version }}
  {% else %}
  RUN npm install -g @google/gemini-cli
  {% endif %}
