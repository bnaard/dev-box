name: ai-continue
version: "1.0.0"
description: "Continue CLI – provider-agnostic coding agent"
profile_intent: provider-cli
usage_class: manual-escalation-only
profiles: ["human-dev"]
exported_surfaces: ["cli-binary", "config-files"]
builder_weight: null

tools:
  - name: cn
    description: "Continue CLI for provider-agnostic coding-agent workflows"
    default_enabled: true
    default_version: ""
    supported_versions: []

builder: null

runtime: |
  # Addon: ai-continue
  # Continue CLI: https://github.com/continuedev/continue
  # npm package: @continuedev/cli | Binary: cn | Config: ~/.continue/
  # Provider-agnostic (Anthropic, OpenAI, Gemini, Ollama, …), headless-native.
  # Headless mode: cn -p "prompt" | Auth: per-provider API key via CONTINUE_API_KEY
  USER aibox
  {% if tools.cn.version %}
  RUN npm install -g @continuedev/cli@{{ tools.cn.version }}
  {% else %}
  RUN npm install -g @continuedev/cli
  {% endif %}
  USER root
