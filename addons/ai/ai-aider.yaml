name: ai-aider
version: "1.0.0"
description: "Aider – AI pair programming via CLI"
profile_intent: provider-cli
usage_class: manual-escalation-only
profiles: ["human-dev"]
exported_surfaces: ["cli-binary", "config-files"]
builder_weight: null

tools:
  - name: aider
    description: "Aider AI pair-programming CLI"
    default_enabled: true
    default_version: ""
    supported_versions: []

builder: null

runtime: |
  # Addon: ai-aider
  {% if tools.aider.version %}
  RUN uv tool install aider-chat=={{ tools.aider.version }}
  {% else %}
  RUN uv tool install aider-chat
  {% endif %}
