name: ai-copilot
version: "1.0.0"
description: "GitHub Copilot CLI"
profile_intent: provider-cli
usage_class: manual-escalation-only
profiles: ["human-dev"]
exported_surfaces: ["cli-binary", "config-files"]
builder_weight: null

tools:
  - name: copilot
    description: "GitHub Copilot CLI"
    default_enabled: true
    default_version: ""
    supported_versions: []

builder: null

runtime: |
  # Addon: ai-copilot
  # GitHub Copilot CLI: https://github.com/github/copilot-cli
  # npm package: @github/copilot | Binary: copilot | Config: ~/.copilot/
  # Requires a GitHub Copilot subscription. First-launch auth: copilot /login
  USER aibox
  {% if tools.copilot.version %}
  RUN npm install -g @github/copilot@{{ tools.copilot.version }}
  {% else %}
  RUN npm install -g @github/copilot
  {% endif %}
  USER root
