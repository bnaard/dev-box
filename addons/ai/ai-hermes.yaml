name: ai-hermes
version: "1.0.0"
description: "Hermes autonomous AI agent (Nous Research, multi-provider)"
profile_intent: provider-cli
usage_class: manual-escalation-only
profiles: ["human-dev"]
exported_surfaces: ["cli-binary", "config-files"]
builder_weight: null

tools:
  - name: hermes
    description: "Nous Hermes autonomous AI agent CLI"
    default_enabled: true
    default_version: "0.18.0"
    supported_versions: ["0.16.0", "0.18.0"]

builder: null

runtime: |
  # Addon: ai-hermes
  # Hermes Agent: https://hermes-agent.nousresearch.com
  # Open-source autonomous agent by Nous Research with TUI, persistent memory,
  # and self-improving skill system. Supports multiple model providers.
  # Config: ~/.hermes/  |  Binary: hermes
  # Auth: Set the relevant provider API key (ANTHROPIC_API_KEY, OPENAI_API_KEY, etc.)
  #
  # Hermes Agent currently publishes Python package artifacts rather than
  # per-platform hermes-linux-* binaries. Install through uv tool so pinned
  # versions resolve through PyPI metadata and the unpinned path follows the
  # latest package release.
  USER aibox
  {% if tools.hermes.version %}
  RUN uv tool install hermes-agent=={{ tools.hermes.version }}
  {% else %}
  RUN uv tool install hermes-agent
  {% endif %}
  USER root
