name: monitoring
version: "1.0.0"
description: "btop (resource monitor) and lazydocker (container TUI)"
profile_intent: interactive
usage_class: manual-escalation-only
profiles: ["human-dev"]
exported_surfaces: ["cli-binary"]
builder_weight: "light"

tools:
  - name: btop
    default_enabled: false
    default_version: ""
    supported_versions: []
  - name: lazydocker
    default_enabled: false
    default_version: ""
    supported_versions: []

runtime: |
  # Addon: monitoring — btop resource monitor and lazydocker container TUI
  USER root
  {% if tools.btop.enabled %}
  RUN apt-get update && apt-get install -y --no-install-recommends \
      btop \
      && rm -rf /var/lib/apt/lists/*
  {% endif %}
  {% if tools.lazydocker.enabled %}
  RUN ARCH="$(uname -m | sed 's/x86_64/x86_64/;s/aarch64/arm64/')" && \
      LD_VERSION="$(curl -fsSL -o /dev/null -w '%{url_effective}' \
        https://github.com/jesseduffield/lazydocker/releases/latest | sed 's|.*/v||')" && \
      curl -fsSL "https://github.com/jesseduffield/lazydocker/releases/download/v${LD_VERSION}/lazydocker_${LD_VERSION}_Linux_${ARCH}.tar.gz" \
        -o /tmp/lazydocker.tar.gz && \
      tar xz -C /usr/local/bin -f /tmp/lazydocker.tar.gz lazydocker && \
      rm /tmp/lazydocker.tar.gz
  {% endif %}
  # ── Variant 1 disable-then-purge guards ───────────────────────────────
  {% if not tools.btop.enabled %}
  RUN if dpkg-query -W -f='${Status}' btop 2>/dev/null | grep -q 'install ok installed'; then \
        apt-get purge -y --auto-remove btop; \
      fi && rm -rf /var/lib/apt/lists/*
  {% endif %}
  {% if not tools.lazydocker.enabled %}
  USER root
  RUN rm -f /usr/local/bin/lazydocker /usr/bin/lazydocker
  {% endif %}
