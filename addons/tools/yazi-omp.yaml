name: yazi-omp
version: "1.0.0"
description: "oh-my-posh for the omp.yazi header prompt"
profile_intent: interactive
usage_class: automated
profiles: ["human-dev"]
exported_surfaces: ["shell-integration", "cli-binary"]
builder_weight: null

tools:
  - name: oh-my-posh
    default_enabled: true
    default_version: ""
    supported_versions: []

runtime: |
  # Addon: yazi-omp — install oh-my-posh for the omp.yazi Yazi header plugin.
  {% if tools["oh-my-posh"].enabled %}
  RUN ARCH=$(uname -m) && \
      OMP_ARCH=$(case "$ARCH" in x86_64) echo amd64;; aarch64) echo arm64;; *) echo "$ARCH";; esac) && \
      {% if tools["oh-my-posh"].version %}
      OMP_VERSION="{{ tools["oh-my-posh"].version }}" && \
      curl -fsSL "https://github.com/JanDeDobbeleer/oh-my-posh/releases/download/v${OMP_VERSION}/posh-linux-${OMP_ARCH}" \
        -o /usr/local/bin/oh-my-posh && \
      curl -fsSL "https://github.com/JanDeDobbeleer/oh-my-posh/releases/download/v${OMP_VERSION}/posh-linux-${OMP_ARCH}.sha256" \
        -o /tmp/omp.sha256 && \
      echo "$(cat /tmp/omp.sha256)  /usr/local/bin/oh-my-posh" | sha256sum -c && \
      rm /tmp/omp.sha256 && \
      {% else %}
      OMP_VERSION="$(curl -fsSL -o /dev/null -w '%{url_effective}' \
        https://github.com/JanDeDobbeleer/oh-my-posh/releases/latest \
        | sed 's|.*/v||')" && \
      curl -fsSL "https://github.com/JanDeDobbeleer/oh-my-posh/releases/download/v${OMP_VERSION}/posh-linux-${OMP_ARCH}" \
        -o /usr/local/bin/oh-my-posh && \
      curl -fsSL "https://github.com/JanDeDobbeleer/oh-my-posh/releases/download/v${OMP_VERSION}/posh-linux-${OMP_ARCH}.sha256" \
        -o /tmp/omp.sha256 && \
      echo "$(cat /tmp/omp.sha256)  /usr/local/bin/oh-my-posh" | sha256sum -c && \
      rm /tmp/omp.sha256 && \
      {% endif %}
      chmod +x /usr/local/bin/oh-my-posh
  {% endif %}
  {% if not tools["oh-my-posh"].enabled %}
  # Variant 1 disable-then-purge: oh-my-posh is a downloaded standalone binary.
  USER root
  RUN rm -f /usr/local/bin/oh-my-posh /usr/bin/oh-my-posh
  {% endif %}
