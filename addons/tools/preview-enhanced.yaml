name: preview-enhanced
version: "1.0.0"
description: "Rich Markdown rendering, ffmpeg, and Ghostscript"
profile_intent: preview-media
usage_class: automated
profiles: ["human-dev"]
exported_surfaces: ["previewer", "cli-binary", "config-files"]
builder_weight: "light"
requires: ["preview-archive"]

tools:
  - name: ffmpeg
    description: "Video and audio metadata plus thumbnail support for previews"
    default_enabled: true
    default_version: ""
    supported_versions: []
  - name: ghostscript
    description: "PostScript and EPS rendering support for document previews"
    default_enabled: true
    default_version: ""
    supported_versions: []
  - name: rich
    description: "Markdown, JSON, RST, and notebook terminal rendering for Yazi previews"
    default_enabled: true
    default_version: ""
    supported_versions: []

runtime: |
  # Addon: preview-enhanced — rich docs, video thumbnails, and EPS
  # Use preview-archive for baseline image/PDF/SVG and archive preview helpers.
  # This addon adds python3-rich (Markdown), ffmpeg (video), and ghostscript (EPS).
  USER root
  {% if tools.rich.enabled or tools.ffmpeg.enabled or tools.ghostscript.enabled %}
  RUN apt-get update && apt-get install -y --no-install-recommends \
  {% if tools.rich.enabled %}
      python3-rich \
  {% endif %}
  {% if tools.ffmpeg.enabled %}
      ffmpeg \
  {% endif %}
  {% if tools.ghostscript.enabled %}
      ghostscript \
  {% endif %}
      && rm -rf /var/lib/apt/lists/*
  {% endif %}
  # ── Variant 1 disable-then-purge guards ───────────────────────────────
  {% if not tools.rich.enabled %}
  RUN if dpkg-query -W -f='${Status}' python3-rich 2>/dev/null | grep -q 'install ok installed'; then \
        apt-get purge -y --auto-remove python3-rich; \
      fi && rm -rf /var/lib/apt/lists/*
  {% endif %}
  {% if not tools.ffmpeg.enabled %}
  RUN if dpkg-query -W -f='${Status}' ffmpeg 2>/dev/null | grep -q 'install ok installed'; then \
        apt-get purge -y --auto-remove ffmpeg; \
      fi && rm -rf /var/lib/apt/lists/*
  {% endif %}
  {% if not tools.ghostscript.enabled %}
  RUN if dpkg-query -W -f='${Status}' ghostscript 2>/dev/null | grep -q 'install ok installed'; then \
        apt-get purge -y --auto-remove ghostscript; \
      fi && rm -rf /var/lib/apt/lists/*
  {% endif %}
