name: cloud-gcp
version: "1.0.0"
description: "Google Cloud SDK (gcloud)"
profile_intent: runtime
usage_class: automated
profiles: ["human-dev", "headless-runner"]
exported_surfaces: ["cli-binary", "config-files"]
builder_weight: null

tools:
  - name: gcloud-cli
    default_enabled: true
    default_version: ""
    supported_versions: []

builder: null

runtime: |
  # Addon: cloud-gcp
  {% if tools["gcloud-cli"].enabled %}
  RUN curl -fsSL https://packages.cloud.google.com/apt/doc/apt-key.gpg | gpg --dearmor -o /usr/share/keyrings/cloud.google.gpg && \
      echo "deb [signed-by=/usr/share/keyrings/cloud.google.gpg] https://packages.cloud.google.com/apt cloud-sdk main" > /etc/apt/sources.list.d/google-cloud-sdk.list && \
      apt-get update && apt-get install -y --no-install-recommends google-cloud-cli && \
      rm -rf /var/lib/apt/lists/*
  {% endif %}
  {% if not tools["gcloud-cli"].enabled %}
  # Variant 1 disable-then-purge: google-cloud-cli ships as an apt package.
  USER root
  RUN if dpkg-query -W -f='${Status}' google-cloud-cli 2>/dev/null | grep -q 'install ok installed'; then \
        apt-get update && apt-get purge -y --auto-remove google-cloud-cli && rm -rf /var/lib/apt/lists/*; \
      fi && \
      rm -f /etc/apt/sources.list.d/google-cloud-sdk.list /usr/share/keyrings/cloud.google.gpg
  {% endif %}
