name: data-preview
version: "1.0.0"
description: "SQLite and tabular data preview tools for Yazi"
profile_intent: preview-media
usage_class: automated
profiles: ["human-dev"]
exported_surfaces: ["previewer", "cli-binary", "config-files"]
builder_weight: "light"

tools:
  - name: sqlite3
    description: "SQLite shell used to preview database schemas and tables"
    default_enabled: true
    default_version: ""
    supported_versions: []
  - name: csvkit
    description: "CSV and TSV inspection utilities for tabular previews"
    default_enabled: true
    default_version: ""
    supported_versions: []

runtime: |
  # Addon: data-preview — SQLite and tabular previews for Yazi.
  # Adds sqlite3 plus csvkit's csvlook/in2csv for CSV, TSV, XLS, and XLSX previews.
  USER root
  {% if tools.sqlite3.enabled or tools.csvkit.enabled %}
  RUN apt-get update && apt-get install -y --no-install-recommends \
  {% if tools.sqlite3.enabled %}
      sqlite3 \
  {% endif %}
  {% if tools.csvkit.enabled %}
      csvkit \
  {% endif %}
      && rm -rf /var/lib/apt/lists/*
  {% endif %}
  # ── Variant 1 disable-then-purge guards ───────────────────────────────
  {% if not tools.sqlite3.enabled %}
  RUN if dpkg-query -W -f='${Status}' sqlite3 2>/dev/null | grep -q 'install ok installed'; then \
        apt-get purge -y --auto-remove sqlite3; \
      fi && rm -rf /var/lib/apt/lists/*
  {% endif %}
  {% if not tools.csvkit.enabled %}
  RUN if dpkg-query -W -f='${Status}' csvkit 2>/dev/null | grep -q 'install ok installed'; then \
        apt-get purge -y --auto-remove csvkit; \
      fi && rm -rf /var/lib/apt/lists/*
  {% endif %}
