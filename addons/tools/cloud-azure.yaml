name: cloud-azure
version: "1.0.0"
description: "Azure CLI"
profile_intent: runtime
usage_class: automated
profiles: ["human-dev", "headless-runner"]
exported_surfaces: ["cli-binary", "config-files"]
builder_weight: null

tools:
  - name: azure-cli
    default_enabled: true
    default_version: ""
    supported_versions: []

builder: null

runtime: |
  # Addon: cloud-azure
  {% if tools["azure-cli"].enabled %}
  RUN pip3 install --no-cache-dir azure-cli
  {% endif %}
  {% if not tools["azure-cli"].enabled %}
  # Variant 1 disable-then-purge: azure-cli installs as a pip package.
  USER root
  RUN pip3 uninstall -y azure-cli azure-cli-core 2>/dev/null || true
  {% endif %}
